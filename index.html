<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS CI/CD Deployment</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
        }

        header {
            background: #232f3e;
            color: white;
            padding: 30px;
        }

        .container {
            margin: 80px auto;
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #232f3e;
        }

        .success {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>AWS CI/CD Pipeline</h1>
</header>

<div class="container">

    <h1>Deployment Successful 🚀</h1>

    <p class="success">
        Application deployed successfully!
    </p>

    <p>
        This website is hosted on an AWS EC2 instance
        using Nginx.
    </p>

    <p>
        Deployment is automated using GitHub Actions.
    </p>

    <hr>

    <p>
        <b>Technology Stack</b>
    </p>

    <p>
        GitHub → GitHub Actions → AWS EC2 → Nginx
    </p>

</div>

<footer>
    AWS CI/CD Demonstration
</footer>

</body>
</html>
